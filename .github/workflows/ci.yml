name: CI

on:
  # Branch pushes are covered by their pull request; one runner serves every repo.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The monorepo is private. The org's GitHub App mints a token, valid for an hour, that can
      # only read tidefell/tidefell; it downloads the pinned release's docs.
      - name: Token for the monorepo
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.CROSS_REPO_CI_APP }}
          private-key: ${{ secrets.CROSS_REPO_CI_KEY }}
          owner: Tidefell
          repositories: tidefell
          permission-contents: read
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: Fetch the pinned release's docs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: nix develop --command scripts/fetch-docs.sh
      - name: Shell, Nix and spelling checks
        run: nix flake check
      - name: Build
        run: nix develop --command zola build
      - name: Check internal links
        run: nix develop --command zola check --skip-external-links
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 7
          name: site
          path: public

  # The workflows themselves (ADR 0031): actionlint, and zizmor, whose findings of medium
  # severity or higher fail, so actions stay pinned by commit.
  workflows:
    name: Workflows
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        # It downloads under $HOME, which the runners on this machine share; a HOME of
        # each job's own keeps jobs running at once from overwriting each other's files.
        env:
          HOME: ${{ runner.temp }}
        with:
          tool: zizmor@1.30.1
      - name: actionlint
        # install-action does not carry it: the release binary, checked against its checksum.
        run: |
          version=1.7.12
          name="actionlint_${version}_linux_amd64.tar.gz"
          curl -sfL -o "$RUNNER_TEMP/$name" "https://github.com/rhysd/actionlint/releases/download/v$version/$name"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$name" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: zizmor
        run: zizmor --offline --min-severity medium .
