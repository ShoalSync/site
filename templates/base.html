<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="stylesheet" href="{{ get_url(path='tokens.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='giallo-light.css') }}" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="{{ get_url(path='giallo-dark.css') }}" media="(prefers-color-scheme: dark)">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }} blog" href="{{ get_url(path='atom.xml') }}">
</head>
<body>
  <header class="site">
    <nav>
      <a class="brand" href="{{ get_url(path='/') }}">Tidefell</a>
      <a href="{{ config.base_url }}/docs/latest/">Docs</a>
      <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
      <a href="{{ config.extra.repository }}">Source</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
  <footer class="site">
    <p>
      Documentation for Tidefell {{ load_data(path="TIDEFELL_VERSION", format="plain") | trim }}.
      Site content is licensed under
      <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
    </p>
  </footer>
</body>
</html>
